[project]
name = "terrain-wgs84-proxy"
version = "0.1.0"
description = "Proxy for Esri Terrain3D ImageServer that serves WGS84 ellipsoidal heights"
readme = "README.md"
authors = [
    { email = "mike.haggerty@airspacelink.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pyproj>=3.7.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
terrain-wgs84-proxy = "terrain_wgs84_proxy:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "lerc>=4.0.1",
    "pytest>=9.2.0",
]
